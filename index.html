<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki-Masters GIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0b; --panel:#131316; --line:#23232a; --txt:#f2f2f4; --dim:#8b8b96; --accent:#2fbf8f;
    --L:#facc15; --UR:#fb923c; --SR:#f472b6; --R:#c084fc; --PC:#93c5fd; --C:#6ee7b7;
    --head:"Outfit",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--txt); font:14px system-ui,sans-serif;
    background:radial-gradient(1200px 500px at 50% -150px, #16302a 0%, transparent 70%), var(--bg); min-height:100vh; }
  .wrap { max-width:1500px; margin:0 auto; padding:0 24px; }

  /* ---------- en-tête ---------- */
  header { padding:26px 0 8px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font:800 15px var(--head); color:#04150f;
    background:linear-gradient(135deg,#2fbf8f,#7ee8c4); box-shadow:0 0 24px #2fbf8f66; }
  h1 { font:800 30px/1 var(--head); margin:0; letter-spacing:-.5px; }
  .sub { color:var(--dim); margin-top:5px; }
  .kicker { font:700 11px var(--head); letter-spacing:.18em; color:var(--accent); margin-bottom:4px; }

  /* ---------- stats / raretés ---------- */
  #stats { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:14px 18px; margin:14px 0; }
  .rar { display:flex; align-items:center; gap:7px; cursor:pointer; font:600 14px var(--head); opacity:.35; transition:.15s; user-select:none; }
  .rar.on { opacity:1; }
  .rar i { width:11px; height:11px; border-radius:4px; background:var(--c); box-shadow:0 0 8px var(--c); }
  .rar b { color:var(--txt); }
  #total { margin-left:auto; color:var(--dim); font-size:12px; }
  .note { flex-basis:100%; margin:2px 0 0; padding-top:10px; border-top:1px solid #ffffff0d; font-size:11px; line-height:1.5; color:#5a5a64; }

  /* ---------- outils ---------- */
  .tools { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  #q { flex:1; min-width:220px; padding:12px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font-size:14px; }
  #q:focus, select:focus { outline:2px solid #2fbf8f66; }
  select { padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font-size:14px; }
  #favonly { padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--txt); font-weight:700; cursor:pointer; }
  #favonly.on { background:#facc15; border-color:#facc15; color:#3a2f00; }

  /* ---------- cartes ---------- */
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:22px; padding-bottom:30px; }
  .card { --c:#888; position:relative; aspect-ratio:5/7.2; border-radius:18px; overflow:hidden; cursor:default;
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #121214) 0%, #121214 65%);
    border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow:0 0 14px color-mix(in srgb, var(--c) 22%, transparent);
    transition:transform .25s, box-shadow .25s; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-4px) scale(1.04); z-index:2; box-shadow:0 0 30px color-mix(in srgb, var(--c) 60%, transparent); }
  .pic { position:relative; height:46%; flex:none; background:#000; }
  .pic img { width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .pic::after { content:""; position:absolute; inset:auto 0 0 0; height:40%; background:linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events:none; }
  .badge { position:absolute; top:8px; left:8px; z-index:2; padding:2px 9px; border-radius:7px; font:800 12px var(--head); color:#0d1117; background:var(--c); box-shadow:0 0 10px var(--c); }
  .info { flex:1; min-height:0; padding:10px 12px 12px; display:flex; flex-direction:column; }
  .name { font:700 13px/1.2 var(--head); margin:0 0 5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:#fff; }
  .desc { margin:0; font-size:11px; line-height:1.35; color:#b4b4bd; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .foot { margin-top:auto; padding-top:6px; border-top:1px solid #ffffff14; font:600 10px var(--head); letter-spacing:.12em; color:var(--c); }

  /* ---------- étoile favori (visible au survol uniquement) ---------- */
  .star { position:absolute; top:5px; right:5px; z-index:3; padding:4px; background:none; border:0; line-height:0; cursor:pointer; opacity:0; transition:opacity .15s; }
  .card:hover .star { opacity:1; }
  @media (hover:none) { .star { opacity:1; } }
  .star svg { width:24px; height:24px; fill:rgba(255,255,255,.1); stroke:rgba(255,255,255,.9); stroke-width:1.6; stroke-linejoin:round; filter:drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  .star.on svg { fill:#facc15; stroke:#facc15; }

  #pager { display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 40px; }
  #pager button { padding:10px 18px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--txt); font-weight:700; cursor:pointer; }
  #pager button:disabled { opacity:.3; cursor:default; }
  #pager span { color:var(--dim); }
  #empty { text-align:center; color:var(--dim); padding:90px 20px; border:1px dashed var(--line); border-radius:18px; }
  mark { background:#facc1555; color:inherit; border-radius:3px; }
</style>
</head>
<body>

<!--
  ================= COLLE TON TEXTE ICI =================
  Colle tout ton texte (Nom / Rareté / Description / Lien, blocs séparés par ----------)
  entre la balise ouvrante et la balise fermante ci-dessous, enregistre le fichier
  puis recharge la page. Ne touche pas aux deux balises <script>.
-->
<script type="text/plain" id="embedded">
</script>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">GIF</div>
      <div>
        <div class="kicker">WIKI-MASTERS</div>
        <h1>Collection GIF</h1>
        <div class="sub">Toutes les cartes animées du jeu</div>
      </div>
    </div>
  </header>

  <div id="stats"></div>

  <div class="tools">
    <input id="q" type="search" placeholder="Rechercher par nom ou description…">
    <select id="sort" title="Trier">
      <option value="rarity">Tri : rareté (L → C)</option>
      <option value="fav">Tri : favoris d'abord</option>
    </select>
    <button id="favonly" title="Afficher seulement les favoris">★ Favoris</button>
  </div>

  <div id="grid"></div>
  <div id="empty" hidden>Aucune carte pour le moment.<br>Colle ton texte dans le code du fichier, dans le bloc « COLLE TON TEXTE ICI ».</div>
  <div id="pager" hidden></div>
</div>

<script>
const ORDER = ["L", "UR", "SR", "R", "PC", "C"];
const PAGE = 48;
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const $ = (id) => document.getElementById(id);
const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const rank = (r) => { const i = ORDER.indexOf(r); return i < 0 ? 99 : i; };

let cards = [], filtered = [], pageIdx = 0, favOnly = false;
const activeR = new Set(ORDER);
let favs = new Set();

function parse(text) {
  const out = [], seen = new Set();
  for (const block of text.split(/\n\s*-{5,}\s*\n/)) {
    const parts = block.trim().split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    if (parts.length < 2) continue;
    const url = parts[parts.length - 1];
    if (!/^https?:\/\//i.test(url)) continue;
    const rest = parts.slice(0, -1);
    const name = rest.shift();
    let rarity = "?";
    if (rest.length && /^(L|UR|SR|R|PC|C)$/.test(rest[0])) rarity = rest.shift();
    const desc = rest.join(" ");
    const k = name + "|" + url;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ name, rarity, desc, url, key: norm(name + " " + desc) });
  }
  return out.sort((a, b) => rank(a.rarity) - rank(b.rarity)); // L → UR → SR → R → PC → C
}

function renderStats() {
  const s = $("stats");
  s.innerHTML = "";
  for (const r of ORDER) {
    const n = cards.filter((c) => c.rarity === r).length;
    const d = document.createElement("div");
    d.className = "rar" + (activeR.has(r) ? " on" : "");
    d.style.setProperty("--c", `var(--${r})`);
    d.innerHTML = `<i></i>${r} : <b>${n}</b>`;
    d.onclick = () => { activeR.has(r) ? activeR.delete(r) : activeR.add(r); renderStats(); apply(); };
    s.appendChild(d);
  }
  const t = document.createElement("div");
  t.id = "total";
  s.appendChild(t);
  const n = document.createElement("div");
  n.className = "note";
  n.textContent = "★ Vos favoris sont enregistrés dans les cookies (données du site) de votre navigateur, sur cet appareil uniquement. " +
    "Si vous supprimez les cookies ou les données de navigation, utilisez la navigation privée ou changez de navigateur ou d'appareil, " +
    "vos favoris seront perdus ou n'apparaîtront plus : ils ne sont pas sauvegardés en ligne.";
  s.appendChild(n);
}

function updateTotal() {
  const t = $("total");
  if (t) t.textContent = `${filtered.length} affichées · ${cards.length} au total · ★ ${favs.size}`;
}

function apply() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  let list = cards.filter((c) =>
    (c.rarity === "?" || activeR.has(c.rarity)) &&
    (!favOnly || favs.has(c.url)) &&
    words.every((w) => c.key.includes(w)));
  if ($("sort").value === "fav") {
    list = list.filter((c) => favs.has(c.url)).concat(list.filter((c) => !favs.has(c.url)));
  }
  filtered = list;
  pageIdx = 0;
  $("empty").hidden = cards.length > 0;
  updateTotal();
  render();
}

function hl(el, text, words) {
  el.textContent = "";
  if (!words.length) { el.textContent = text; return; }
  const re = new RegExp("(" + words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  text.split(re).forEach((part, i) => {
    if (i % 2) { const m = document.createElement("mark"); m.textContent = part; el.appendChild(m); }
    else el.appendChild(document.createTextNode(part));
  });
}

function saveFavs() { try { localStorage.setItem("galerie-favs", JSON.stringify([...favs])); } catch (e) {} }

// Les images ne se chargent que lorsqu'elles sont proches de l'écran, et sont déchargées quand elles s'éloignent
// (évite que des centaines de GIF animés tournent en même temps)
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const img = e.target;
    if (e.isIntersecting) {
      if (!img.getAttribute("src")) img.src = img.dataset.src;
    } else if (img.getAttribute("src")) {
      img.removeAttribute("src");
    }
  }
}, { rootMargin: "500px" });

function render() {
  io.disconnect();
  const grid = $("grid");
  grid.innerHTML = "";
  const words = $("q").value.trim().split(/\s+/).filter(Boolean);
  const frag = document.createDocumentFragment();
  for (const c of filtered.slice(pageIdx * PAGE, (pageIdx + 1) * PAGE)) {
    const d = document.createElement("div");
    d.className = "card";
    d.style.setProperty("--c", ORDER.includes(c.rarity) ? `var(--${c.rarity})` : "#888");

    const pic = document.createElement("div");
    pic.className = "pic";
    const img = document.createElement("img");
    img.referrerPolicy = "no-referrer"; img.alt = c.name; img.dataset.src = c.url;
    img.onclick = () => window.open(c.url, "_blank");
    pic.appendChild(img);
    io.observe(img);

    const b = document.createElement("div");
    b.className = "badge"; b.textContent = c.rarity;

    const st = document.createElement("button");
    st.className = "star" + (favs.has(c.url) ? " on" : "");
    st.title = "Favori";
    st.innerHTML = STAR;
    st.onclick = (e) => {
      e.stopPropagation();
      if (favs.has(c.url)) favs.delete(c.url); else favs.add(c.url);
      st.classList.toggle("on", favs.has(c.url));
      saveFavs();
      updateTotal();
    };

    const info = document.createElement("div");
    info.className = "info";
    const n = document.createElement("h3"); n.className = "name"; hl(n, c.name, words);
    const p = document.createElement("p"); p.className = "desc"; hl(p, c.desc, words);
    const f = document.createElement("div"); f.className = "foot"; f.textContent = "GIF · " + c.rarity;
    info.append(n, p, f);

    d.append(pic, b, st, info);
    frag.appendChild(d);
  }
  grid.appendChild(frag);
  renderPager();
}

function renderPager() {
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  const pg = $("pager");
  pg.hidden = pages <= 1;
  pg.innerHTML = "";
  const prev = document.createElement("button");
  prev.textContent = "← Précédent"; prev.disabled = pageIdx === 0;
  prev.onclick = () => go(pageIdx - 1);
  const label = document.createElement("span");
  label.textContent = `Page ${pageIdx + 1} / ${pages}`;
  const next = document.createElement("button");
  next.textContent = "Suivant →"; next.disabled = pageIdx >= pages - 1;
  next.onclick = () => go(pageIdx + 1);
  pg.append(prev, label, next);
}

function go(i) {
  pageIdx = i;
  render();
  window.scrollTo({ top: 0 });
}

$("sort").onchange = apply;
$("favonly").onclick = () => { favOnly = !favOnly; $("favonly").classList.toggle("on", favOnly); apply(); };
let t;
$("q").oninput = () => { clearTimeout(t); t = setTimeout(apply, 150); };

// démarrage : texte du code + favoris sauvegardés
cards = parse($("embedded").textContent);
try { favs = new Set(JSON.parse(localStorage.getItem("galerie-favs") || "[]")); } catch (e) {}
renderStats();
apply();
</script>
</body>
</html>
